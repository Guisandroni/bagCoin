# Desenvolvimento local: docker compose up --build
services:
  app:
    build:
      context: ./apps/server
    env_file:
      - ./apps/server/.env
    environment:
      DEBUG: "true"
      ENVIRONMENT: local
      EMAIL_PROVIDER: resend_api
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-bagcoin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bagcoin123}
      POSTGRES_DB: ${POSTGRES_DB:-bagcoin}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-}
    volumes:
      - ./apps/server/app:/app/app
      - ./apps/server/alembic:/app/alembic
      - ./apps/server/cli:/app/cli
      - media_data:/app/media
      - reports_data:/app/reports
    ports:
      - "127.0.0.1:8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health', timeout=5).raise_for_status()"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ./apps/web
      target: dev
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      API_URL: http://app:8000/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bagcoin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bagcoin123}
      POSTGRES_DB: ${POSTGRES_DB:-bagcoin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-db-init:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGDATABASE: postgres
      PGUSER: ${POSTGRES_USER:-bagcoin}
      PGPASSWORD: ${POSTGRES_PASSWORD:-bagcoin123}
      BAGCOIN_DB_NAME: ${POSTGRES_DB:-bagcoin}
      EVOLUTION_DB_USER: ${EVOLUTION_DB_USER:-}
      EVOLUTION_DB_PASSWORD: ${EVOLUTION_DB_PASSWORD:-}
      EVOLUTION_DB_NAME: ${EVOLUTION_DB_NAME:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-}
    volumes:
      - ./deploy/evolution/init-db.sh:/init-db.sh:ro
    entrypoint: ["sh", "/init-db.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  evolution-api:
    # Test-only: v2.3.7 is affected by CVE-2026-48063.
    image: evoapicloud/evolution-api:v2.3.7
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_URL: ${EVOLUTION_PUBLIC_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_DB_USER:-}:${EVOLUTION_DB_PASSWORD:-}@db:5432/${EVOLUTION_DB_NAME:-}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: bagcoin_evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: bagcoin_evolution
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      evolution-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
  reports_data:
  evolution_instances:
